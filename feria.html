<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Optimizo · TechAI Summit</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="recursos/optimizo-isotipo.svg" type="image/svg+xml">
<link rel="stylesheet" href="feria.css?v=6">
</head>
<body>
<!-- Registro del stand en TechAI Summit: una pregunta por pantalla; cada pregunta se escribe sola. -->
<header class="cabeza">
  <img class="logo" src="recursos/optimizo-logo.svg" alt="Optimizo">
  <span class="evento">TechAI Summit 2026</span>
</header>
<div class="avance" aria-hidden="true"><i id="avance"></i></div>

<main class="escenario">

  <section class="paso" data-paso="bienvenida" hidden>
    <h1 class="titulo"></h1>
    <p class="bajada">Gracias por pasar por nuestro stand. Responde seis preguntas cortas y te contactamos para seguir la conversación.</p>
    <div class="acciones"><button class="boton" type="button" data-accion="seguir">Empezar</button><span class="tecla"><kbd>Enter</kbd></span></div>
  </section>

  <section class="paso" data-paso="nombre" hidden>
    <p class="cuenta">1 de 6</p>
    <h1 class="titulo"><label for="nombre"></label></h1>
    <div class="campo"><input id="nombre" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Tu nombre" enterkeyhint="next"></div>
    <p class="aviso" role="alert"></p>
    <div class="acciones"><button class="boton" type="button" data-accion="seguir">Continuar</button><span class="tecla"><kbd>Enter</kbd></span></div>
  </section>

  <section class="paso" data-paso="empresa" hidden>
    <p class="cuenta">2 de 6</p>
    <h1 class="titulo"><label for="empresa"></label></h1>
    <div class="campo"><input id="empresa" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Nombre de tu empresa" enterkeyhint="next"></div>
    <p class="aviso" role="alert"></p>
    <div class="acciones"><button class="boton" type="button" data-accion="seguir">Continuar</button><button class="enlace" type="button" data-accion="omitir">No tengo empresa</button></div>
  </section>

  <section class="paso" data-paso="cargo" hidden>
    <p class="cuenta">3 de 6</p>
    <h1 class="titulo"><label for="cargo"></label></h1>
    <div class="campo"><input id="cargo" autocomplete="off" spellcheck="false" placeholder="Tu cargo" enterkeyhint="next"></div>
    <p class="aviso" role="alert"></p>
    <div class="acciones"><button class="boton" type="button" data-accion="seguir">Continuar</button><button class="enlace" type="button" data-accion="omitir">Omitir</button></div>
  </section>

  <section class="paso" data-paso="celular" hidden>
    <p class="cuenta">4 de 6</p>
    <h1 class="titulo"><label for="celular"></label></h1>
    <div class="campo"><span class="prefijo">+56</span><input id="celular" inputmode="tel" autocomplete="off" placeholder="9 1234 5678" enterkeyhint="next"></div>
    <p class="aviso" role="alert"></p>
    <div class="acciones"><button class="boton" type="button" data-accion="seguir">Continuar</button><button class="enlace" type="button" data-accion="omitir">Prefiero dejar mi correo</button></div>
  </section>

  <section class="paso" data-paso="correo" hidden>
    <p class="cuenta">5 de 6</p>
    <h1 class="titulo"><label for="correo"></label></h1>
    <div class="campo"><input id="correo" type="email" inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="nombre@empresa.cl" enterkeyhint="next"></div>
    <p class="aviso" role="alert"></p>
    <div class="acciones"><button class="boton" type="button" data-accion="seguir">Continuar</button><button class="enlace" type="button" data-accion="omitir" data-omitir-correo>Omitir</button></div>
  </section>

  <section class="paso paso-ancho" data-paso="interes" hidden>
    <p class="cuenta">6 de 6</p>
    <h1 class="titulo"></h1>
    <div class="opciones" role="group" aria-label="Intereses">
      <button type="button" class="opcion" data-v="Discovery Optimizo" aria-pressed="false" style="--tono:#387E80">
        <span class="opcion-marca"><img src="recursos/optimizo-logo.svg" alt="Optimizo"></span>
        <span class="opcion-texto"><span>Diseñamos e implementamos soluciones de IA a la medida de tu operación.</span></span>
        <i class="check" aria-hidden="true"></i>
      </button>
      <button type="button" class="opcion" data-v="Lumina" aria-pressed="false" style="--tono:#EC6D27">
        <span class="opcion-marca"><img src="recursos/feria/lumina-completo.svg" alt="Lumina"></span>
        <span class="opcion-texto"><span>Visión artificial que detecta riesgos en tu operación y avisa a tiempo.</span></span>
        <i class="check" aria-hidden="true"></i>
      </button>
      <button type="button" class="opcion" data-v="Médula" aria-pressed="false" style="--tono:#34529D">
        <span class="opcion-marca"><img src="recursos/feria/medula-completo.svg" alt="Medula"></span>
        <span class="opcion-texto"><span>Conecta las apps e información de tu empresa con agentes de IA.</span></span>
        <i class="check" aria-hidden="true"></i>
      </button>
    </div>
    <div class="acciones"><button class="boton" type="button" data-accion="seguir" data-boton-interes>Omitir</button><span class="tecla"><kbd>Enter</kbd></span></div>
  </section>

  <section class="paso" data-paso="listo" hidden>
    <h1 class="titulo"></h1>
    <dl class="resumen" id="resumen"></dl>
    <label class="permiso">
      <input type="checkbox" id="permiso" checked>
      <span class="interruptor" aria-hidden="true"></span>
      <span>Optimizo puede usar estos datos para contactarme. No los compartimos con nadie.</span>
    </label>
    <p class="aviso" role="alert"></p>
    <div class="acciones"><button class="boton" type="button" data-accion="enviar" id="enviar"><span>Enviar</span></button></div>
  </section>

  <section class="paso" data-paso="gracias" hidden>
    <h1 class="titulo"></h1>
    <p class="bajada" id="gracias-texto"></p>
    <div class="acciones"><button class="boton" type="button" id="otro">Registrar a otra persona</button><span class="tecla" id="regreso"></span></div>
  </section>
</main>

<button class="atras" type="button" id="atras" aria-label="Volver" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="equipo-abrir" type="button" id="equipo-abrir">Equipo</button>

<!-- Panel del equipo (queda en este notebook) -->
<div class="hoja" id="hoja" hidden>
  <div class="hoja-caja" role="dialog" aria-modal="true" aria-labelledby="hoja-titulo">
    <h2 id="hoja-titulo">Equipo del stand</h2>
    <p class="hoja-sub">Queda guardado en este equipo.</p>
    <p class="hoja-eti">Registrado por</p>
    <div class="segmentos" id="registrado">
      <button type="button" data-v="Joaquín">Joaquín</button><button type="button" data-v="Max">Max</button><button type="button" data-v="César">César</button>
      <button type="button" data-v="Bastián">Bastián</button><button type="button" data-v="Alejandro">Alejandro</button><button type="button" data-v="Otro">Otro</button>
    </div>
    <label class="permiso fila-hoja">
      <input type="checkbox" id="llamar" checked>
      <span class="interruptor" aria-hidden="true"></span>
      <span>Llamar al teléfono del stand al terminar</span>
    </label>
    <p class="hoja-sub" id="cola-estado"></p>
    <button type="button" class="boton" id="hoja-cerrar">Listo</button>
    <button type="button" class="enlace hoja-reiniciar" id="hoja-reiniciar">Empezar de nuevo (borra lo escrito)</button>
  </div>
</div>

<script src="feria.js?v=8"></script>
</body>
</html>
